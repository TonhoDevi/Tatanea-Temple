# Perfil padrão: desenvolvimento local com H2 em memória
spring.application.name=cosmos-sombrio

spring.datasource.url=jdbc:h2:mem:ddtdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway cria o schema; Hibernate só valida (ddl-auto=validate acima)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS do frontend Vite (dev server)
app.cors.allowed-origins=http://localhost:5173

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
