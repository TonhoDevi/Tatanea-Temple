# Perfil de produção: PostgreSQL
# Ative com: --spring.profiles.active=prod (ou SPRING_PROFILES_ACTIVE=prod)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cosmos_sombrio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

app.cors.allowed-origins=${FRONTEND_URL:https://seu-dominio.com}
