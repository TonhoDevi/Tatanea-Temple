# Perfil de produção: PostgreSQL
# Ative com: --spring.profiles.active=prod (ou SPRING_PROFILES_ACTIVE=prod)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cosmos_sombrio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

app.cors.allowed-origins=${FRONTEND_URL:https://seu-dominio.com}

# Sem valor padrão de propósito: em produção o segredo do JWT tem que vir de
# uma variável de ambiente real, nunca do valor de desenvolvimento hardcoded
# em application.properties. Se JWT_SECRET não for definida, o app falha ao
# subir em vez de assinar tokens com o segredo de dev.
app.jwt.secret=${JWT_SECRET}
app.jwt.validade-ms=${JWT_VALIDADE_MS:86400000}
