name: Keep backend alive

# O backend roda no free tier do Render, que "dorme" depois de ~15 minutos
# sem receber requisições (ver DEPLOY.md). Esse workflow faz um ping
# periódico pra manter o serviço sempre acordado, evitando os 30-50s de
# cold start na próxima visita real de um usuário.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar o backend
        run: |
          curl -sS --fail --max-time 30 --retry 3 --retry-delay 10 \
            "https://tatanea-temple.onrender.com/api/talentos" \
            -o /dev/null -w "status=%{http_code} tempo=%{time_total}s\n"
